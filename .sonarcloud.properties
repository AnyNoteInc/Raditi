# SonarCloud automatic analysis scope (read from the default branch).
# Product code is analysed as source; tests, test fixtures and verification stands are
# analysed as test code, which does not count toward the plan's lines of code; local
# infrastructure, documents, research scripts, migrations and the site CI templates are
# not analysed. A file must not match both the source and the test set.

sonar.sourceEncoding=UTF-8

sonar.sources=.
# Only the paths where a mistake costs the most: keys and the model gateway, the agent's way to
# a site, the preview's public entry, releases to production, web's API routes, payments, Vault,
# git, sandboxes, the site plugin and the deploy configuration. The plan's 50 000 lines are
# shared by the organisation's projects; the rest of the product (cabinet UI, domain rules,
# tRPC, billing) stays out until the plan is raised (owner, 19.10.2026).
# The list follows the code that docs/plan/56-nest-modules.md moved, with about the same lines:
# the model gateway of llm left src/gateway/ for its module folders (src/subscriptions, the
# operator's commands, stays out as before); the key issuing of turn-keys went to core's src/llm
# and src/site-env, its admission to llm's src/accounting; the production content access of
# releases went to core's src/site-content; packages/preview-gateway became apps/preview's
# src/gateway, src/access, src/cookie and src/config/browser-relays.ts.
sonar.inclusions=apps/llm/src/gateway/**,apps/llm/src/egress/**,apps/llm/src/pool/**,apps/llm/src/accounting/**,apps/llm/src/maintenance/**,apps/llm/src/infra/**,apps/llm/src/config/**,apps/core/src/llm/**,apps/core/src/site-env/**,apps/core/src/site-content/site-content-access.ts,apps/mcp/src/**,packages/turn-keys/src/**,packages/site-content/src/published-value.ts,packages/site-content/src/site-content-resolver.ts,packages/site-content/src/preview-db-values.ts,apps/preview/src/gateway/**,apps/preview/src/access/**,apps/preview/src/cookie/**,apps/preview/src/config/browser-relays.ts,apps/core/src/release-api/**,apps/core/src/releases/**,apps/core/src/deploy-step/**,apps/core/src/runner-api/**,apps/web/src/app/**,apps/web/src/server/**,apps/web/src/proxy.ts,packages/auth/src/**,packages/yookassa/src/**,packages/vault/src/**,packages/git-providers/src/**,packages/sandbox-providers/**,packages/site-connections/src/**,infra/wordpress/**,infra/sandbox/**,infra/preview/**,infra/egress/**,infra/app/**,.github/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mts,**/*.test.mjs,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,apps/e2e/**,**/src/testing/**,**/src/testing.ts,**/components/*/testing.ts,**/fixtures/**,**/*-fixture.mjs,**/*-fixtures.ts,**/scripts/verify-*.mjs,infra/*/verify-*.mjs,infra/dev/**,docs/**,ci/**,**/generated/**,packages/db/prisma/migrations/**

