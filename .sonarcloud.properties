# SonarCloud automatic analysis scope (read from the default branch).
# Product code is analysed as source; tests, test fixtures and verification stands are
# analysed as test code, which does not count toward the plan's lines of code; local
# infrastructure, documents, research scripts, migrations and the site CI templates are
# not analysed. A file must not match both the source and the test set.

sonar.sourceEncoding=UTF-8

sonar.sources=.
# Only the paths where a mistake costs the most: keys and the model gateway, the agent's way to
# a site, the preview's public entry, releases to production, web's API routes, payments, Vault,
# git, sandboxes, the site plugin and the deploy configuration. The plan's 50 000 lines are
# shared by the organisation's projects; the rest of the product (cabinet UI, domain rules,
# tRPC, billing) stays out until the plan is raised (owner, 19.10.2026).
sonar.inclusions=apps/orchestrator/src/llm-gateway/**,apps/orchestrator/src/llm/**,apps/orchestrator/src/mcp/**,apps/orchestrator/src/preview-gateway/**,apps/orchestrator/src/release-api/**,apps/orchestrator/src/releases/**,apps/orchestrator/src/deploy-step/**,apps/orchestrator/src/runner-api/**,apps/web/src/app/**,apps/web/src/server/**,apps/web/src/proxy.ts,packages/auth/src/**,packages/yookassa/src/**,packages/vault/src/**,packages/git-providers/src/**,packages/sandbox-providers/**,packages/site-connections/src/**,infra/wordpress/**,infra/sandbox/**,infra/preview/**,infra/egress/**,infra/app/**,.github/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mts,**/*.test.mjs,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,apps/e2e/**,**/src/testing/**,**/src/testing.ts,**/components/*/testing.ts,**/fixtures/**,**/*-fixture.mjs,**/*-fixtures.ts,**/scripts/verify-*.mjs,infra/*/verify-*.mjs,infra/dev/**,docs/**,ci/**,**/generated/**,packages/db/prisma/migrations/**

sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mts,**/*.test.mjs,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,apps/e2e/**,**/src/testing/**,**/src/testing.ts,**/components/*/testing.ts,**/fixtures/**,**/*-fixture.mjs,**/*-fixtures.ts,**/scripts/verify-*.mjs,infra/*/verify-*.mjs
sonar.test.exclusions=infra/dev/**,docs/**,ci/**,**/generated/**
