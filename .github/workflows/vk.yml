name: VK

# The VK community of a client (docs/plan/99-vk-community.md, slice 99.8): the connection by its key,
# what the agent reads, the cards and their publication, the notices of new comments and the switch
# of «Встроенные MCP», on disposable PostgreSQL and OpenBao with the policies of the platform and the
# fake of api.vk.com of infra/dev/vk-verify. Synthetic data only: no repository secrets, no real VK.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/vk.yml
      - .github/actions/setup/**
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      # The stand, its fake of VK and the helpers it shares with the browser-task stand.
      - infra/dev/vk-verify/**
      - infra/dev/browser-task-verify/runtime.mjs
      - infra/dev/browser-task-verify/services.mjs
      - infra/dev/browser-task-verify/stand.mjs
      - infra/dev/billing-verify/openbao.mjs
      - infra/dev/billing-verify/stand.mjs
      - infra/dev/db-verify/command.mjs
      # The mounts and policies the keys of VK live under.
      - infra/vault/bootstrap.mjs
      - infra/vault/policies/**
      # What the stand runs: core and mcp from their dist, the packages from their sources.
      - apps/core/**
      - apps/mcp/**
      - packages/**
  workflow_dispatch:

concurrency:
  group: vk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-vk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      # The stand never pulls: the images of browser-task-verify/stand.mjs, pinned by digest.
      - name: Pull the pinned images
        run: |
          for image in \
            postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 \
            ghcr.io/openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
          do
            docker pull --quiet "$image"
          done
      - name: Verify the VK community on built core and mcp
        run: pnpm verify:vk
