name: Deploy

# A release to the single server (infra/server/README.md). release.yml calls it after the images
# of a new tag are published; workflow_dispatch deploys a tag that exists (a repeat or a rollback
# to an earlier release). It copies infra/app and infra/server of the tag with the release's
# images.env to the server and runs infra/server/deploy.sh there over SSH. The server's host key
# is pinned (SSH_KNOWN_HOSTS); the registry token is the job's GITHUB_TOKEN, read once on stdin.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.25.0
        type: string
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      # The tag comes through env, never into the script text.
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$TAG is not a release tag vX.Y.Z" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Download images.env of the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern images.env --dir "$RUNNER_TEMP"
          grep -q '^SANDBOX_IMAGE=' "$RUNNER_TEMP/images.env" ||
            { echo "::error::images.env of $TAG has no SANDBOX_IMAGE: built before the single server" >&2; exit 1; }
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 0600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The secrets as typed may carry a newline, spaces or `-p`: the port keeps its digits only
          port=${SSH_PORT//[^0-9]/}
          host=${SSH_HOST//[[:space:]]/}
          user=${SSH_USERNAME//[[:space:]]/}
          [ -n "$port" ] && [ -n "$host" ] && [ -n "$user" ] ||
            { echo "::error::SSH_HOST, SSH_PORT and SSH_USERNAME must be set" >&2; exit 1; }
          printf 'Host server\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "$host" "$port" "$user" > ~/.ssh/config
      - name: Copy the release to the server
        env:
          TAG: ${{ inputs.tag }}
        run: |
          ssh server "install -d -m 0700 /opt/raditi/incoming/$TAG"
          rsync -a --delete infra/app/ "server:/opt/raditi/incoming/$TAG/app/"
          rsync -a --delete infra/server/ "server:/opt/raditi/incoming/$TAG/server/"
          rsync -a infra/billing/rates/ "server:/opt/raditi/incoming/$TAG/server/rates/"
          rsync -a --delete ci/ "server:/opt/raditi/incoming/$TAG/ci/"
          rsync -a "$RUNNER_TEMP/images.env" "server:/opt/raditi/incoming/$TAG/images.env"
      - name: Deploy
        env:
          TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" |
            ssh server "/opt/raditi/incoming/$TAG/server/deploy.sh $TAG $GITHUB_ACTOR"
      - name: The site answers
        env:
          APP_URL: ${{ vars.APP_URL || 'https://raditi.ru' }}
        run: |
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "$APP_URL/api/health" && { echo "$APP_URL is up"; exit 0; }
            sleep 5
          done
          echo "::error::$APP_URL/api/health does not answer" >&2
          exit 1
