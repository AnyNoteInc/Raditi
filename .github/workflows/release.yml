name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # A pull request merged up to date with main brings main the very tree its CI has passed on:
  # the gates of that tree are not run a second time (.github/scripts/verified-by-pull-request.sh).
  # Any other push — a merge of a branch behind main, a commit straight to main — runs them here.
  verified:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Was this tree checked in its pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: .github/scripts/verified-by-pull-request.sh

  gates:
    needs: verified
    if: needs.verified.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [verified, gates]
    # gates is skipped when the tree was verified: then release runs on the verdict alone.
    if: >-
      !cancelled() && needs.verified.result == 'success' &&
      (needs.gates.result == 'success' ||
       (needs.gates.result == 'skipped' && needs.verified.outputs.passed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Remember the tags of this commit
        run: git tag --points-at HEAD --list 'v*' | sort > "$RUNNER_TEMP/tags-before"

      - name: Run semantic-release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release tags the commit locally before it pushes: a tag that was not here before
      # is the new release. A rerun of the same commit publishes nothing and builds no images.
      - name: Read the tag of the new release
        id: tag
        run: |
          git tag --points-at HEAD --list 'v*' | sort > "$RUNNER_TEMP/tags-after"
          tag=$(comm -13 "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after" | tail -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "New release: ${tag:-none}"

  # The tag semantic-release pushed with GITHUB_TOKEN starts no workflow, so the images are built
  # from here, and the deploy to the single server follows them (infra/server/README.md).
  # A job whose chain holds a skipped job (gates, when the tree was verified) is skipped too unless
  # its condition says !cancelled(), so both jobs below state it with the result they need.
  images:
    needs: release
    if: >-
      !cancelled() && needs.release.result == 'success' && needs.release.outputs.tag != ''
    uses: ./.github/workflows/publish-images.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: write
      packages: write

  deploy:
    needs: [release, images]
    if: >-
      !cancelled() && needs.images.result == 'success' && needs.release.outputs.tag != ''
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      packages: read
    secrets: inherit
