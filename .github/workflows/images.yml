name: Images

# The production images of the apps (docs/plan/55-split-orchestrator.md): llm, mcp, preview, the
# runner of the sandbox VMs, the browser worker (docs/plan/57-browser-tasks.md) and core, each
# built from its own Dockerfile and checked from the outside (pnpm verify:images): its own app
# starts and refuses an empty configuration, no git, gitleaks, .env or stand — core alone carries
# git and gitleaks, no older than its Dockerfile pins, for its git worker, whose second entry
# refuses an empty configuration too (docs/plan/84-projects.md, ПР33) — and nothing of the
# platform's data in the runner. core is checked only when named locally (`--only core`); here it
# has a job of its own like the others. web is built by edge.yml, the llm image also runs for real
# in llm-app.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/images.yml
      - .nvmrc
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - apps/llm/**
      - apps/mcp/**
      - apps/preview/**
      - apps/runner/**
      - apps/browser/**
      - apps/core/**
      - packages/**
      - infra/app/verify-images.mjs
  workflow_dispatch:

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One image per runner, all six at once: the build of each is its own, the checks the same. The
  # core image is the largest (git, gitleaks and its operator commands): about three minutes to
  # build on a runner as it comes (publish-images.yml), well inside the limit below.
  images:
    name: image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [llm, mcp, preview, runner, browser, core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # verify-images.mjs needs Node alone: Docker builds the image, the workspace is not installed.
      # One image and its build cache fit the runner's disk as it comes.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Build and check the image of ${{ matrix.app }}
        run: node infra/app/verify-images.mjs --only ${{ matrix.app }}
