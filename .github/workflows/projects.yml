name: Projects

# The projects stand (docs/plan/84-projects.md, §6 and §10; infra/dev/projects-verify/README.md):
# `pnpm verify:projects` on the Linux of the runner, the sandbox of a turn under runc — a project
# with its files, instructions and memory, an own GitLab server and gitlab.com, a GitHub App, a
# repository fetched by the git worker, the turn that publishes to the mirror only, the cards that
# send, merge and deploy, the trash. The real apps of this tree and the real OpenCode CLI on a
# scripted synthetic Z.ai; fakes of GitLab and GitHub with real git smart HTTP. Only synthetic
# data: no repository secrets, no real model, provider or key. The host of the runner is `linux`
# for the stand (`hostOf`): its relays carry the gateway of a turn and the forwarder of 443 from the
# bridge gateway to the apps and the fakes on loopback.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/projects.yml
      - .github/actions/setup/**
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      # The stand and the modules it shares with the stands of the browser and of billing.
      - infra/dev/projects-verify/**
      - infra/dev/browser-task-verify/**
      - infra/dev/billing-verify/**
      - infra/dev/db-verify/command.mjs
      - infra/vault/**
      # The sandbox of a turn: its image, gateway, host rules and watchdog, and who runs it.
      - infra/sandbox/**
      - packages/sandbox-providers/**
      - packages/local-turns/**
      - packages/agent-drivers/**
      # The trusted git of projects and its worker, the providers, the cards, the memory, the trash.
      - apps/core/src/git/**
      - apps/core/src/git-worker/**
      - apps/core/src/git-workspace/**
      - apps/core/src/projects/**
      - apps/core/src/tasks/**
      - apps/core/src/turns/**
      - apps/core/src/schedules/**
      - apps/core/Dockerfile
      - apps/mcp/src/memory/**
      - apps/mcp/src/repo/**
      - packages/git-providers/**
      - packages/domain/src/git/**
      - packages/domain/src/memory/**
      - packages/domain/src/projects/**
      - packages/domain/src/repo/**
      - packages/db/prisma/**
      - packages/trpc/src/services/git/**
      - packages/trpc/src/services/projects/**
      - packages/trpc/src/routers/git-connection.ts
      - packages/trpc/src/routers/project.ts
      - packages/trpc/src/routers/project-file.ts
      - packages/trpc/src/routers/project-memory.ts
      - packages/trpc/src/routers/project-repo.ts
      - apps/web/src/app/api/git/**
      - apps/web/src/app/api/project-files/**
      - apps/web/src/app/api/webhooks/github/**
      - apps/web/src/app/api/webhooks/gitlab/**
  workflow_dispatch:

concurrency:
  group: projects-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stand:
    runs-on: ubuntu-latest
    # A first value, not a measurement: after the first runs it becomes the measured time plus half.
    timeout-minutes: 75
    env:
      # The engine of the sandbox VM (spec §8): fixed addresses on a subnet Docker picks need
      # Docker Engine 29.1, and the runner image ships 28.0.4 (browser.yml).
      SANDBOX_DOCKER_VERSION: 29.5.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A private copy of the tree with its install and builds, and the image of the sandbox with
      # its Chromium: drop preinstalled toolchains the job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force >/dev/null
          df -h /
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Docker Engine of the sandbox VM
        run: |
          key=$(mktemp)
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 https://download.docker.com/linux/ubuntu/gpg -o "$key"
          fingerprint=$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$fingerprint" != 9DC858229FC7DD38854AE2D88D81803C0EBFCD88 ]; then
            echo "Unexpected fingerprint of the key of Docker's repository: $fingerprint" >&2
            exit 1
          fi
          sudo install -D -m 0644 "$key" /etc/apt/keyrings/docker.asc
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $codename stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get -q -o Acquire::Retries=3 update
          package=$(apt-cache madison docker-ce | awk '{ print $3 }' \
            | grep -F ":$SANDBOX_DOCKER_VERSION-" | head -n 1)
          if [ -z "$package" ]; then
            echo "Docker's repository has no docker-ce $SANDBOX_DOCKER_VERSION for $codename" >&2
            exit 1
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -q -y -o Acquire::Retries=3 install \
            --no-install-recommends --allow-downgrades --allow-change-held-packages \
            "docker-ce=$package" "docker-ce-cli=$package"
      # The stand takes its own builds by repository digest: only the containerd store gives one.
      - name: Docker with the containerd image store
        run: |
          daemon=/etc/docker/daemon.json
          current=$(sudo cat "$daemon" 2>/dev/null || echo '{}')
          printf '%s' "$current" \
            | jq '.features = ((.features // {}) + {"containerd-snapshotter": true})' \
            | sudo tee "$daemon" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{.DriverStatus}}' | grep -q io.containerd.snapshotter
          test "$(docker version --format '{{.Server.Version}}')" = "$SANDBOX_DOCKER_VERSION"
          test "$(docker info --format '{{.DefaultRuntime}}')" = runc
      # The stand never pulls (`--pull never`): the images it checks before it starts, by digest.
      - name: Pull the pinned images
        run: |
          set -o pipefail
          node --input-type=module -e "
            const stand = await import('./infra/dev/browser-task-verify/stand.mjs')
            for (const image of [stand.POSTGRES_IMAGE, stand.REDIS_IMAGE, stand.S3_IMAGE, stand.OPENBAO_IMAGE])
              console.log(image)
          " | while read -r image; do docker pull --quiet "$image"; done
      # Gitleaks of the image apps/core/Dockerfile pins, the binary only: one pin for the git worker
      # of the stand and the image. The worker runs `gitleaks` by name.
      - name: Gitleaks of the core image
        run: |
          image=$(sed -n 's/^ARG GITLEAKS_IMAGE=//p' apps/core/Dockerfile)
          test -n "$image"
          docker pull --quiet "$image"
          container=$(docker create "$image")
          docker cp "$container:/usr/bin/gitleaks" "$RUNNER_TEMP/gitleaks"
          docker rm "$container" >/dev/null
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - name: Projects stand
        env:
          # The redacted logs of a failed run, kept as an artifact below.
          PROJECTS_VERIFY_LOG_DIR: ${{ runner.temp }}/projects-verify-logs
        run: pnpm verify:projects
      - name: Logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: projects-verify-logs
          path: ${{ runner.temp }}/projects-verify-logs
          if-no-files-found: ignore
          retention-days: 7
