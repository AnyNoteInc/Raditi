name: Agent driver

# The real CLI of the agent driver, OpenCode, in the production agent runtime, and the sandbox
# provider's Docker isolation suites on a real daemon. Local fixtures only: no repository secrets
# or provider accounts.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-driver.yml
      - .github/actions/setup/**
      - .nvmrc
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/domain/**
      - packages/agent-drivers/**
      # The provider, its gateway and guard, the watchdog and the images they run in.
      - packages/sandbox-providers/**
      - infra/sandbox/**
  workflow_dispatch:

concurrency:
  group: agent-driver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The real OpenCode CLI of the runtime image, through its driver: containers without a
  # network, a scripted provider and an MCP stub on loopback, no key of a plan. On this runner
  # the image carries the x64 baseline binary, which no local stand has run. The types, the lint
  # and the unit tests of the driver and of the domain run in ci.yml, job gates.
  verify-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Build sandbox runtime
        run: docker build -f infra/sandbox/Dockerfile --target runtime -t raditi-g3verify-sandbox:local .
      - name: Verify real OpenCode with isolated local fixtures
        run: pnpm verify:opencode

  # The opt-in suites of @repo/sandbox-providers and the watchdog against a real daemon (rule 5):
  # internal network without DNS, host, bridge and internet unreachable, the route allowlist,
  # read-only rootfs, uid 10001, exec replay. Under runc; gVisor is verified on the sandbox VM
  # (docs/plan/03-p2-verification.md). The unit tests of the package use a fake dockerode.
  sandbox-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The engine of the sandbox VM (spec §8), the version the isolation was verified on. The
      # gateway manager gives its containers fixed addresses on a bridge whose subnet Docker
      # picks: engines before 29.1 refuse that («user specified IP address is supported only when
      # connecting to networks with user configured subnets»), and the runner image ships 28.0.4.
      SANDBOX_DOCKER_VERSION: 29.5.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      # From Docker's own repository, where the runner image takes its engine from; the image
      # drops the repository and its key afterwards. The key must be Docker's release key.
      - name: Docker Engine of the sandbox VM
        run: |
          docker version --format 'Runner image: Docker client {{.Client.Version}}, server {{.Server.Version}}'
          key=$(mktemp)
          curl -fsSL --retry 3 https://download.docker.com/linux/ubuntu/gpg -o "$key"
          fingerprint=$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$fingerprint" != 9DC858229FC7DD38854AE2D88D81803C0EBFCD88 ]; then
            echo "Unexpected fingerprint of the key of Docker's repository: $fingerprint" >&2
            exit 1
          fi
          sudo install -D -m 0644 "$key" /etc/apt/keyrings/docker.asc
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $codename stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get -q -o Acquire::Retries=3 update
          package=$(apt-cache madison docker-ce | awk '{ print $3 }' \
            | grep -F ":$SANDBOX_DOCKER_VERSION-" | head -n 1)
          if [ -z "$package" ]; then
            echo "Docker's repository has no docker-ce $SANDBOX_DOCKER_VERSION for $codename" >&2
            exit 1
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -q -y -o Acquire::Retries=3 install \
            --no-install-recommends --allow-downgrades --allow-change-held-packages \
            "docker-ce=$package" "docker-ce-cli=$package"
      # The provider takes images pinned by digest only, and a local build has a repository
      # digest only in the containerd image store.
      - name: Docker with the containerd image store
        run: |
          daemon=/etc/docker/daemon.json
          current=$(sudo cat "$daemon" 2>/dev/null || echo '{}')
          printf '%s' "$current" \
            | jq '.features = ((.features // {}) + {"containerd-snapshotter": true})' \
            | sudo tee "$daemon" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{.DriverStatus}}' | grep -q io.containerd.snapshotter
          # The engine the suites run on, after its last restart.
          docker version --format 'Docker client {{.Client.Version}}, server {{.Server.Version}}'
          test "$(docker version --format '{{.Server.Version}}')" = "$SANDBOX_DOCKER_VERSION"
      - name: Build and pin the sandbox images
        run: |
          for target in runtime gateway network-guard; do
            docker build -f infra/sandbox/Dockerfile --target "$target" \
              -t "raditi-civerify-sandbox-$target:local" .
          done
          pinned() {
            reference=$(docker image inspect "raditi-civerify-sandbox-$1:local" \
              --format '{{index .RepoDigests 0}}')
            case "$reference" in
              *@sha256:*) printf '%s' "$reference" ;;
              *) echo "No repository digest for the $1 image" >&2; return 1 ;;
            esac
          }
          runtime=$(pinned runtime)
          gateway=$(pinned gateway)
          guard=$(pinned network-guard)
          # Gateway containers reach the upstream of the test, on this runner, through docker0.
          upstream=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          test -n "$upstream"
          {
            echo "RADITI_DOCKER_TEST_IMAGE=$runtime"
            echo "SANDBOX_GATEWAY_IMAGE=$gateway"
            echo "SANDBOX_NETWORK_GUARD_IMAGE=$guard"
            echo "RADITI_DOCKER_TEST_UPSTREAM_HOST=$upstream"
          } >> "$GITHUB_ENV"
      # The provider hides the daemon's errors by design and removes what it created. A record
      # of what the daemon did — names, actions and exit codes of containers and networks; never
      # commands, environment or labels — is printed only when a suite fails.
      - name: Record what the daemon does
        run: |
          nohup docker events --filter type=container --filter type=network \
            --filter event=create --filter event=start --filter event=die --filter event=destroy \
            --filter event=connect --filter event=disconnect \
            --format '{{.Time}} {{.Type}} {{.Action}} {{index .Actor.Attributes "name"}} {{index .Actor.Attributes "exitCode"}}' \
            > "$RUNNER_TEMP/docker-events.log" 2>&1 &
      - name: Sandbox provider against the real daemon
        run: pnpm --filter @repo/sandbox-providers test
      - name: Watchdog against the real daemon
        run: node --test infra/sandbox/watchdog.integration.test.mjs
      - name: What the daemon did
        if: failure()
        run: |
          docker version --format 'Docker client {{.Client.Version}}, server {{.Server.Version}}' || true
          tail -n 400 "$RUNNER_TEMP/docker-events.log" || true
          sudo journalctl -u docker --since '30 min ago' --no-pager -o cat | tail -n 100 || true
