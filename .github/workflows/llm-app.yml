name: App LLM profile

# Production image wiring and real packet filtering, using only disposable local fixtures.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/llm-app.yml
      - .github/actions/setup/**
      - .nvmrc
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/core/**
      - apps/preview/**
      - packages/ip-address/**
      - apps/runner/**
      - apps/mcp/**
      - apps/llm/**
      - packages/snapshots/**
      - packages/local-turns/**
      - packages/turn-keys/**
      - packages/site-content/**
      - packages/service-runtime/**
      - packages/app-bootstrap/**
      - packages/**
      - infra/app/**
      - infra/dev/llm-verify/**
      - infra/egress/**
      - infra/vault/**
  workflow_dispatch:

concurrency:
  group: llm-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-llm-app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The engine of the app VM with the llm profile (infra/app/README.md), the version the stand
      # was verified on. core reaches llm through the port llm publishes for another bridge
      # network; with the userland proxy off Docker 28 drops that path by its inter-network
      # isolation (DOCKER-ISOLATION-STAGE-2), and the runner image ships 28.0.4.
      APP_DOCKER_VERSION: 29.5.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Generate Prisma client
        run: pnpm db:generate
      # From Docker's own repository, where the runner image takes its engine from; the image
      # drops the repository and its key afterwards. The key must be Docker's release key.
      - name: Docker Engine of the app VM
        run: |
          key=$(mktemp)
          curl -fsSL --retry 3 https://download.docker.com/linux/ubuntu/gpg -o "$key"
          fingerprint=$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$fingerprint" != 9DC858229FC7DD38854AE2D88D81803C0EBFCD88 ]; then
            echo "Unexpected fingerprint of the key of Docker's repository: $fingerprint" >&2
            exit 1
          fi
          sudo install -D -m 0644 "$key" /etc/apt/keyrings/docker.asc
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $codename stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get -q -o Acquire::Retries=3 update
          package=$(apt-cache madison docker-ce | awk '{ print $3 }' \
            | grep -F ":$APP_DOCKER_VERSION-" | head -n 1)
          if [ -z "$package" ]; then
            echo "Docker's repository has no docker-ce $APP_DOCKER_VERSION for $codename" >&2
            exit 1
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -q -y -o Acquire::Retries=3 install \
            --no-install-recommends --allow-downgrades --allow-change-held-packages \
            "docker-ce=$package" "docker-ce-cli=$package"
      - name: Docker without userland-proxy
        run: |
          daemon=/etc/docker/daemon.json
          current=$(sudo cat "$daemon" 2>/dev/null || echo '{}')
          printf '%s' "$current" | jq '. + {"userland-proxy": false}' | sudo tee "$daemon" >/dev/null
          sudo systemctl restart docker
          docker info >/dev/null
          if pgrep -x docker-proxy; then echo 'docker-proxy is still running' >&2; exit 1; fi
          # The engine the stand runs on, after its last restart.
          docker version --format 'Docker client {{.Client.Version}}, server {{.Server.Version}}'
          test "$(docker version --format '{{.Server.Version}}')" = "$APP_DOCKER_VERSION"
      - name: Verify configuration and preflight
        run: node --test infra/app/compose.test.mjs infra/app/llm-preflight.test.mjs infra/app/llm-firewall.test.mjs infra/app/verify-llm-firewall.test.mjs infra/app/verify-llm-app.test.mjs
      - name: Verify packet filtering inside an isolated container
        run: pnpm verify:llm-firewall
      - name: Build production llm
        run: docker build -f apps/llm/Dockerfile --target runtime -t raditi-p3verify-llm:b14 .
      - name: Verify production LLM service
        run: pnpm verify:llm-app
