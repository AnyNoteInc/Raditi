name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: raditi
          POSTGRES_PASSWORD: raditi
          POSTGRES_DB: raditi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U raditi -d raditi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.10.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Synthetic CI values only: no real client data on GitHub runners (152-FZ).
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://raditi:raditi@localhost:5432/raditi
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-not-real-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # Squash merges put the PR title into main, and semantic-release reads main.
      - name: Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      - name: Env vars are declared for turbo
        run: pnpm check-env

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Architecture
        run: pnpm check-architecture

      # Tests of @repo/db run against the migrated and seeded CI Postgres (DATABASE_URL above).
      - name: Prisma client
        run: pnpm db:generate

      - name: Migrate database
        run: pnpm db:deploy

      - name: Seed reference data
        run: pnpm db:seed

      - name: Test
        # Shared runners are several times slower than a laptop: jsdom renders and real git
        # processes need more than Vitest's default 5 s per test.
        run: pnpm test -- --testTimeout=30000

      # Sandbox gateway allowlist, watchdog and network guard (the Docker test skips itself);
      # the app VM compose, edge routes and Dockerfiles (the Docker CLI, no daemon); the egress
      # proxy on a synthetic CA (openssl).
      - name: Infrastructure tests
        run: pnpm test:infra

      # The companion plugin is the only code that writes to a client's WordPress database. Its
      # behaviour runs in the WordPress content workflow; a syntax error must not wait for that.
      # The same for the wp-config.php and the mu-plugin every preview runs (plan 53, Р14, Р15).
      # A runner without PHP uses the PHP of the WordPress image pinned in verify-site.mjs.
      - name: WordPress plugin syntax
        run: |
          if command -v php >/dev/null; then
            php -l infra/wordpress/raditi-content.php
            php -l infra/wordpress/raditi-preview.php
            php -l infra/wordpress/preview-wp-config.php
          else
            docker run --rm --network none --entrypoint php \
              -v "$PWD/infra/wordpress:/plugin:ro" \
              wordpress:7.1.2-php8.3-apache@sha256:8ae73d594a154e30b112e8d085afbc0895acf7651d8f53ef63aefb42e30822d5 -l /plugin/raditi-content.php
            docker run --rm --network none --entrypoint php \
              -v "$PWD/infra/wordpress:/plugin:ro" \
              wordpress:7.1.2-php8.3-apache@sha256:8ae73d594a154e30b112e8d085afbc0895acf7651d8f53ef63aefb42e30822d5 -l /plugin/raditi-preview.php
            docker run --rm --network none --entrypoint php \
              -v "$PWD/infra/wordpress:/plugin:ro" \
              wordpress:7.1.2-php8.3-apache@sha256:8ae73d594a154e30b112e8d085afbc0895acf7651d8f53ef63aefb42e30822d5 -l /plugin/preview-wp-config.php
          fi

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

  # The opt-in suites of the subscription gateway, turn keys, pool health, operator login and
  # retirement, and MCP admission: money, key revocation and access checks on real PostgreSQL.
  # Their collectors scan shared tables, so they own this database and run one file at a time
  # (vitest.config.ts); the gates job above keeps them skipped.
  gateway-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: raditi
          POSTGRES_PASSWORD: raditi
          POSTGRES_DB: raditi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U raditi -d raditi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Synthetic CI values only: no real client data, subscription or Vault on GitHub runners.
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://raditi:raditi@localhost:5432/raditi
      RADITI_GATEWAY_DB_TESTS: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Prisma client
        run: pnpm db:generate

      - name: Migrate database
        run: pnpm db:deploy

      # A model changed without a migration still generates and deploys: only this comparison of
      # the migrated database with schema.prisma fails (the same check as in `pnpm verify:db`).
      - name: Schema matches migrations
        run: pnpm --filter @repo/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # The suites look the seeded subscription providers and drivers up by slug.
      - name: Seed reference data
        run: pnpm db:seed

      # No `--` here: pnpm would hand it to Vitest, which then reads the flag as a file filter.
      - name: Turn key, sweeper and release tests with PostgreSQL
        run: pnpm --filter core test:db --testTimeout=30000

      - name: Gateway, pool, lock, login and retire tests with PostgreSQL
        run: pnpm --filter llm test:db --testTimeout=30000

      - name: MCP gateway access, undo and preview tests with PostgreSQL
        run: pnpm --filter mcp test:db --testTimeout=30000

      # The approval of the credit rate reads the whole catalogue — every enabled model, every
      # tariff on sale — and locks `credit_rates`, so its PostgreSQL cases are opt-in as well and
      # the gates job keeps them skipped. They stand on a database without a rate and without an
      # enabled model, which the suites above leave it as, and leave no row behind themselves.
      - name: Credit rate approval with PostgreSQL
        run: pnpm --filter @repo/billing exec vitest run src/credit-rate-approval.test.ts --testTimeout=30000

  # Presigned URLs of the storage adapter on a real S3 API: the pull runner's only way to the
  # session snapshots. A link writes once, only the signed size, and expires. The suite runs
  # only against a loopback S3; the gates job has none and keeps it skipped.
  storage-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Synthetic CI values only: the development identity of infra/dev/seaweedfs-s3.json.
    env:
      APP_ENV: test
      S3_ENDPOINT: http://127.0.0.1:8333
      S3_REGION: ru-central1
      S3_ACCESS_KEY_ID: raditi
      S3_SECRET_ACCESS_KEY: raditi-dev-secret
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # The image the stands pin (serviceImages in verify-agent-supervisor.mjs), on loopback.
      # A service container cannot be given a command, so the job starts it itself.
      - name: Start SeaweedFS with the sessions bucket
        run: |
          docker run -d --name raditi-ci-s3 -p 127.0.0.1:8333:8333 \
            -v "$PWD/infra/dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          shell() { docker exec raditi-ci-s3 sh -c "echo '$1' | weed shell" 2>/dev/null || true; }
          for attempt in $(seq 1 30); do
            # Ready: the bucket is listed and the S3 port answers (any status: 403 unsigned).
            case "$(shell 's3.bucket.list')" in
              *raditi-sessions*)
                if curl -s -o /dev/null --max-time 5 "$S3_ENDPOINT/"; then exit 0; fi ;;
              *) shell 's3.bucket.create -name raditi-sessions' >/dev/null ;;
            esac
            sleep 2
          done
          echo "SeaweedFS did not serve the sessions bucket" >&2
          docker logs --tail 50 raditi-ci-s3 >&2
          exit 1

      - name: Storage adapter against the real S3
        run: pnpm --filter @repo/storage test
