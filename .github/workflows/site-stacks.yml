name: Site stacks

# М2 of the site stacks (docs/plan/62-site-stacks.md, §5.5; docs/plan/62-slices/e3.md, Э3.8): each
# stack of the matrix — every stack with a suite apps/core/src/previews/<stack>-preview.integration.test.ts
# — on the real releases of its CMS, downloaded by sha256 from cms-archives.json into the
# temporary folder of the runner on every run (never a cache, an artifact or an image), installed on
# a synthetic production and run as a preview by its adapter, the real copier and the real runtime
# of previews, under runc. Then М3 and М4 (Э3.13): the job `stand` runs `pnpm verify:stack` of the
# stack — import over SFTP, the preview in the cabinet's frame, the release with its rollback — on the
# Linux of the runner, under runc, the groups named. Only synthetic data; no repository secrets.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/site-stacks.yml
      - .github/actions/setup/**
      - infra/preview/**
      - infra/joomla/**
      - infra/dev/stack-verify/**
      - packages/site-adapters/src/joomla/**
      - packages/site-adapters/src/php/**
      # What the adapters of the matrix import outside their own folder (infra/app/ci.test.mjs
      # checks it), and what the harness of М2 runs besides the folders above.
      - packages/site-adapters/src/php-config.ts
      - packages/site-adapters/src/php-hosting.ts
      - packages/site-adapters/src/no-browser-tasks.ts
      # The support table of WordPress, which the stand reads for its groups (stand.mjs, STACK_SUPPORTS).
      - packages/site-adapters/src/wordpress-stack.ts
      - packages/site-adapters/src/wordpress-public-code.ts
      - packages/site-content/src/**
      - packages/domain/src/site-connection/import-policy.ts
      - apps/core/src/site-provisioning/stack-reading.ts
      - infra/sandbox/**
      - infra/dev/preview-verify/verify-site-images.mjs
      - packages/site-connections/src/database-copy/**
      - packages/sandbox-providers/src/preview/**
      - apps/core/src/previews/**
      - apps/core/src/testing/stack-preview.ts
      - packages/domain/src/preview/**
      # М3 and М4 of the job stand (Э3.13): the import, the release and what it runs on the
      # hosting, the gateway of previews, the content of a preview and the workflows of the sites;
      # what the import and the release run beside their folders — the download of a site, the git
      # of the first commit, of the release and its tag, the values of the plan of the database;
      # the image of the deploy runner and the pin of Gitleaks (infra/app/ci.test.mjs checks them).
      - apps/core/src/site-provisioning/**
      - apps/core/src/releases/**
      - apps/core/src/release-api/**
      - apps/core/src/deploy-step/**
      - apps/core/src/git-workspace/**
      - apps/core/src/site-content/**
      - apps/core/Dockerfile
      - apps/preview/**
      - packages/site-connections/src/hosting/**
      - packages/site-connections/src/sources/**
      - packages/site-connections/src/index.ts
      - packages/site-content/**
      - packages/agent-drivers/cli/**
      - packages/sandbox-providers/runtime/**
      - ci/**
      # What the stand loads beyond its folder (infra/app/ci.test.mjs follows its imports): the
      # services, setup and runtime of the release stand and the stands it borrows from.
      - infra/dev/release-verify/fake-model.mjs
      - infra/dev/browser-task-verify/model.mjs
      - infra/dev/browser-task-verify/programs.mjs
      - infra/dev/release-verify/runtime.mjs
      - infra/dev/release-verify/services.mjs
      - infra/dev/release-verify/setup.mjs
      - infra/dev/release-verify/stand.mjs
      - infra/dev/billing-verify/*.mjs
      - infra/dev/gitea-verify/stand.mjs
      - infra/dev/pipeline-verify/stand.mjs
      - infra/dev/site-import-verify/*.mjs
      - infra/dev/llm-verify/content-scenario.mjs
      - infra/dev/llm-verify/fake-zai.mjs
      - infra/dev/db-verify/command.mjs
      - infra/dev/preview-verify/probes.mjs
      - infra/vault/bootstrap.mjs
      - apps/core/scripts/verify-agent-content-role.mjs
      - apps/core/scripts/verify-agent-supervisor.mjs
      - packages/domain/src/errors.ts
      - packages/sandbox-providers/src/*.ts
      - packages/sandbox-providers/src/gateway/**
  # tasks and mcp change in almost every pull request and the job stand runs an hour: once a week.
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:

concurrency:
  group: site-stacks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Preview of ${{ matrix.stack }}
    runs-on: ubuntu-latest
    # A first value, not a measurement: after the first run on every build of the stacks it becomes
    # the measured time plus half.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stack: [joomla]
    env:
      # The engine of the sandbox VM (spec §8), as in preview.yml.
      SANDBOX_DOCKER_VERSION: 29.5.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Docker Engine of the sandbox VM
        run: |
          key=$(mktemp)
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 https://download.docker.com/linux/ubuntu/gpg -o "$key"
          fingerprint=$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$fingerprint" != 9DC858229FC7DD38854AE2D88D81803C0EBFCD88 ]; then
            echo "Unexpected fingerprint of the key of Docker's repository: $fingerprint" >&2
            exit 1
          fi
          sudo install -D -m 0644 "$key" /etc/apt/keyrings/docker.asc
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $codename stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get -q -o Acquire::Retries=3 update
          package=$(apt-cache madison docker-ce | awk '{ print $3 }' \
            | grep -F ":$SANDBOX_DOCKER_VERSION-" | head -n 1)
          if [ -z "$package" ]; then
            echo "Docker's repository has no docker-ce $SANDBOX_DOCKER_VERSION for $codename" >&2
            exit 1
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -q -y -o Acquire::Retries=3 install \
            --no-install-recommends --allow-downgrades --allow-change-held-packages \
            "docker-ce=$package" "docker-ce-cli=$package"
      # The runtime takes images pinned by digest only, and a local build has a repository digest
      # only in the containerd image store.
      - name: Docker with the containerd image store
        run: |
          daemon=/etc/docker/daemon.json
          current=$(sudo cat "$daemon" 2>/dev/null || echo '{}')
          printf '%s' "$current" \
            | jq '.features = ((.features // {}) + {"containerd-snapshotter": true})' \
            | sudo tee "$daemon" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{.DriverStatus}}' | grep -q io.containerd.snapshotter
          test "$(docker version --format '{{.Server.Version}}')" = "$SANDBOX_DOCKER_VERSION"
      # Only the `site` images of the PHP versions of this stack's builds, without the probes of
      # site-images.yml: `raditi-site-verify:<version>`.
      - name: Build the site images of the stack
        run: >-
          pnpm verify:site-images -- --build-only
          --only "$(node infra/dev/stack-verify/fetch-cms.mjs --php=${{ matrix.stack }})"
      - name: Build the tools and the rules of the host
        run: |
          docker build -q -f infra/preview/Dockerfile --target tools \
            -t raditi-preview-tools:local infra/preview
          docker build -q -f infra/sandbox/Dockerfile --target network-guard \
            -t raditi-network-guard:local .
      # The releases of the stack, checked by sha256 before they are unpacked; unpacked only, they
      # run in the containers of the suite.
      - name: Download the releases of the stack
        env:
          RADITI_CMS_DIR: ${{ runner.temp }}/raditi-cms
        run: node infra/dev/stack-verify/fetch-cms.mjs --stack=${{ matrix.stack }}
      - name: Generate the database client
        run: pnpm db:generate
      - name: Preview of every build of the stack
        env:
          RADITI_PREVIEW_DOCKER_TESTS: '1'
          RADITI_CMS_DIR: ${{ runner.temp }}/raditi-cms
        run: |
          pnpm --filter core exec vitest run --testTimeout=600000 \
            src/previews/${{ matrix.stack }}-preview.integration.test.ts

  # М3 and М4 (docs/plan/62-site-stacks.md, §5.5; docs/plan/62-slices/e3.md, Э3.13): the stand of the
  # stacks on the Linux of the runner — `hostOf` reads the kind `linux`: no loopback mirror, relays of
  # llm, mcp and preview on the bridge gateway (Э3.16). Under runc; М7 (runsc) is a run by hand.
  stand:
    name: Stand of ${{ matrix.stack }}
    needs: preview
    runs-on: ubuntu-latest
    # A first value, not a measurement (as the job preview): after the first run it becomes the
    # measured time plus half.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        stack: [joomla]
    env:
      SANDBOX_DOCKER_VERSION: 29.5.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A private copy of the tree with its install, the images of the platform and of the PHP of
      # every build, the releases of the stack: drop preinstalled toolchains the job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force >/dev/null
          df -h /
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Docker Engine of the sandbox VM
        run: |
          key=$(mktemp)
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 https://download.docker.com/linux/ubuntu/gpg -o "$key"
          fingerprint=$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$fingerprint" != 9DC858229FC7DD38854AE2D88D81803C0EBFCD88 ]; then
            echo "Unexpected fingerprint of the key of Docker's repository: $fingerprint" >&2
            exit 1
          fi
          sudo install -D -m 0644 "$key" /etc/apt/keyrings/docker.asc
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $codename stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get -q -o Acquire::Retries=3 update
          package=$(apt-cache madison docker-ce | awk '{ print $3 }' \
            | grep -F ":$SANDBOX_DOCKER_VERSION-" | head -n 1)
          if [ -z "$package" ]; then
            echo "Docker's repository has no docker-ce $SANDBOX_DOCKER_VERSION for $codename" >&2
            exit 1
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -q -y -o Acquire::Retries=3 install \
            --no-install-recommends --allow-downgrades --allow-change-held-packages \
            "docker-ce=$package" "docker-ce-cli=$package"
      # The stand takes its own builds by repository digest: only the containerd store gives one.
      - name: Docker with the containerd image store
        run: |
          daemon=/etc/docker/daemon.json
          current=$(sudo cat "$daemon" 2>/dev/null || echo '{}')
          printf '%s' "$current" \
            | jq '.features = ((.features // {}) + {"containerd-snapshotter": true})' \
            | sudo tee "$daemon" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{.DriverStatus}}' | grep -q io.containerd.snapshotter
          test "$(docker version --format '{{.Server.Version}}')" = "$SANDBOX_DOCKER_VERSION"
          test "$(docker info --format '{{.DefaultRuntime}}')" = runc
      # The stand never pulls (`--pull never`): the images it checks before it starts, by digest,
      # from its own list.
      - name: Pull the pinned images
        run: |
          set -o pipefail
          node infra/dev/stack-verify/images.mjs --stack=${{ matrix.stack }} | while read -r image; do
            docker pull --quiet "$image"
          done
      # Gitleaks of the image apps/core/Dockerfile pins, the binary only: one pin for both.
      - name: Gitleaks of the core image
        run: |
          image=$(sed -n 's/^ARG GITLEAKS_IMAGE=//p' apps/core/Dockerfile)
          test -n "$image"
          docker pull --quiet "$image"
          container=$(docker create "$image")
          mkdir -p "$RUNNER_TEMP/gitleaks"
          docker cp "$container:/usr/bin/gitleaks" "$RUNNER_TEMP/gitleaks/gitleaks"
          docker rm "$container" >/dev/null
          "$RUNNER_TEMP/gitleaks/gitleaks" version
          echo "P2_GITLEAKS_BINARY=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      # The cabinet's page of P5 runs in Chromium; WebKit is checked by the stand, and on Linux P5
      # notes it (О2б (а), the answer of the owner of 08.11.2026: WebKit of Playwright on Linux
      # drops the frame's cookie).
      - name: Chromium and WebKit of Playwright
        run: pnpm --filter e2e exec playwright install --with-deps chromium webkit
      # The groups are named: without --group the stand would run every group of the stack, and
      # `browser` and `safety-browser` stay local (§5.5). The releases are downloaded by the stand
      # into the temporary folder of the runner, checked by sha256, and run in its containers only.
      - name: Import, preview and release of every build of the stack
        env:
          RADITI_CMS_DIR: ${{ runner.temp }}/raditi-cms
        run: pnpm verify:stack -- --stack=${{ matrix.stack }} --group=import --group=preview --group=release
