# Obligatory deploy pipeline of a site repository (spec §10; docs/plan/53-chat-preview-release.md,
# Р28–Р31). This directory is synchronised into the repository platform/ci of the platform's
# Gitea. Gitea 1.27 runs the files of .gitea/scoped_workflows of a registered source repository in
# every repository of the scope, in that repository's own context: its commit, its secrets and its
# variables. With `[actions] WORKFLOW_DIRS = .git/raditi-no-repository-workflows` (dev compose and
# stands; every Gitea of the platform) no workflow file of a site repository runs at all.
#
# A release is a push of a release tag `vX.Y.Z` made by the release account of the platform; a
# push to `main` deploys nothing, so no change ever deploys twice. `workflow_dispatch` (on a tag
# ref, `refs/tags/vX.Y.Z`) is how core starts a second run of a release — an attempt «только
# возврат» (Р31). The steps are the command `deploy-step` of the orchestrator image: the runner
# label `deploy` names that image in the runner's configuration, never in a repository, and so do
# the addresses of Vault and of the release API and the CA (`runner.envs`). The command checks
# the repository secret RADITI_DEPLOY_WRAP against this run's tag and commit before it unwraps
# anything; a tag of the import, any other tag, or a repeat with a spent wrapping writes nothing.
name: deploy
on:
  push:
    tags: ['v*']
  workflow_dispatch:
# One deploy of a site at a time: a run that arrives while another one is in progress waits and
# is never cancelled by a newer one (a half-done deploy must finish or roll back).
concurrency:
  group: deploy-${{ gitea.repository }}
  cancel-in-progress: false
# By default the job token of Gitea may write to the repository of the job (the mode
# `permissive`): a job of this pipeline only reads it.
permissions:
  contents: read
jobs:
  deploy:
    # An organization can register only its own repositories as a source, so platform/ci is a
    # source of the whole instance and its workflows are triggered in every repository, platform/ci
    # included. Only repositories of the organization `sites` are sites, only a tag `v*` is a
    # release, and `v0.0.0` is the tag of the import (plan 39), which is installed already.
    if: gitea.repository_owner == 'sites' && startsWith(gitea.ref, 'refs/tags/v') && gitea.ref_name != 'v0.0.0'
    runs-on: deploy
    # The command bounds itself (deploy-step/deploy.ts, `deployLimits`): an hour of writing,
    # twenty minutes of rollback, the end offered to core for 25 minutes; the job is cut only
    # past all of them.
    timeout-minutes: 150
    # The facts of the run reach the command as variables, never as a part of a script.
    env:
      RADITI_RUN_EVENT: ${{ gitea.event_name }}
      RADITI_RUN_REF: ${{ gitea.ref }}
      RADITI_RUN_REF_NAME: ${{ gitea.ref_name }}
      RADITI_RUN_SHA: ${{ gitea.sha }}
      RADITI_RUN_SERVER: ${{ gitea.server_url }}
      RADITI_RUN_REPOSITORY: ${{ gitea.repository }}
    steps:
      # Is the secret for this run? Prints the run and `matched`; reaches nothing.
      - name: match
        id: match
        env:
          RADITI_DEPLOY_WRAP: ${{ secrets.RADITI_DEPLOY_WRAP }}
        run: |
          exec node /app/apps/orchestrator/dist/deploy-step/cli.js match
      # Unwraps the secret once and deploys through the release API of core: conflicts, backup,
      # files, records, the check of the site, and the rollback after a failure behind a write.
      - name: deploy
        if: steps.match.outputs.matched == 'true'
        env:
          RADITI_DEPLOY_WRAP: ${{ secrets.RADITI_DEPLOY_WRAP }}
          # Reads the files of the release commit from this repository, nothing else.
          RADITI_JOB_TOKEN: ${{ gitea.token }}
        run: |
          exec node /app/apps/orchestrator/dist/deploy-step/cli.js run
