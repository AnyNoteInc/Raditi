packages:
  - apps/*
  - packages/*

# Dependencies whose install scripts are allowed to run (pnpm 12 blocks the rest).
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  # Optional native speed-up for msgpackr (BullMQ); the pure JS fallback is enough.
  msgpackr-extract: false
  prisma: true

# One place for shared versions: packages reference them as "catalog:".
catalog:
  # TypeScript: `tsc` is the native TS 7 compiler (fast typecheck);
  # the `typescript` module is TS 6, because typescript-eslint, dependency-cruiser,
  # Nest CLI and Next build still need the JS compiler API that TS 7.0 lacks.
  typescript: npm:@typescript/typescript6@6.0.2
  '@typescript/native': npm:typescript@7.0.2
  '@types/node': ^26.6.0

  # Tooling
  turbo: ^2.11.4
  prettier: ^3.9.9
  husky: ^9.1.7
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  semantic-release: ^25.0.9
  '@semantic-release/changelog': ^7.0.0
  '@semantic-release/git': ^11.0.1
  '@semantic-release/github': ^12.0.10
  dependency-cruiser: ^18.4.0

  # Lint
  eslint: ^10.11.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.70.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-only-warn: ^1.2.1
  eslint-plugin-react-hooks: ^7.1.1
  '@next/eslint-plugin-next': ^16.3.6
  eslint-plugin-turbo: ^2.11.4
  globals: ^17.12.0

  # Test
  vitest: ^5.0.2
  vite: ^8.3.1
  '@vitejs/plugin-react': ^6.1.1
  jsdom: ^30.1.1
  '@testing-library/react': ^16.3.3
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/user-event': ^14.6.7

  # Runtime
  tar-stream: ^3.2.1
  zod: ^4.6.5
  decimal.js: ^10.6.0
  superjson: ^2.2.6

  # Database — Prisma pinned exactly: the `latest` tag of the CLI points to 8.0 RC
  prisma: 7.10.0
  '@prisma/client': 7.10.0
  '@prisma/adapter-pg': 7.10.0
  pg: ^8.23.0
  '@types/pg': ^8.23.1
  dotenv: ^18.0.4

  # Auth and API
  better-auth: 1.7.6
  '@trpc/server': ^11.19.0
  '@trpc/client': ^11.19.0
  '@trpc/tanstack-react-query': ^11.19.0
  '@tanstack/react-query': ^5.103.2

  # UI
  next: 16.3.6
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@mui/material': ^9.4.0
  '@mui/icons-material': ^9.4.0
  '@mui/material-nextjs': ^9.4.0
  '@emotion/react': ^11.14.0
  '@emotion/styled': ^11.14.1
  '@emotion/cache': ^11.14.0
  react-hook-form: ^7.88.0
  '@hookform/resolvers': ^5.9.1
  '@yandex/smart-captcha': ^2.9.1

  # Infrastructure clients
  '@aws-sdk/client-s3': ^3.1140.0
  '@aws-sdk/lib-storage': ^3.1140.0
  undici: ^8.11.2
  sendsay-api: ^2.4.0

  # Orchestrator (NestJS 12, ESM)
  '@nestjs/core': ^12.1.0
  '@nestjs/common': ^12.1.0
  '@nestjs/platform-express': ^12.1.0
  '@nestjs/microservices': ^12.1.0
  '@nestjs/testing': ^12.1.0
  '@nestjs/cli': ^12.0.7
  '@nestjs/bullmq': ^12.0.0
  bullmq: ^6.3.0
  ioredis: ^6.0.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  express: ^5.2.1
  '@types/express': ^5.0.6
  '@rekog/mcp-nest': ^2.0.7
  '@modelcontextprotocol/core': ^2.1.0
  '@modelcontextprotocol/node': ^2.1.0
  '@modelcontextprotocol/server': ^2.1.0
  '@prometheus-io/client': ^0.16.1
  unplugin-swc: ^2.0.0
  '@swc/core': ^1.16.2
  supertest: ^7.3.0
  '@types/supertest': ^7.2.1

  # Web (Next.js 16, MDX) and e2e
  '@next/mdx': 16.3.6
  '@mdx-js/loader': ^3.1.1
  '@mdx-js/react': ^3.1.1
  '@types/mdx': ^2.0.14
  remark-gfm: ^4.0.1
  server-only: ^0.0.1
  '@playwright/test': ^1.63.0
  '@next/env': 16.3.6
  '@fontsource-variable/golos-text': ^5.3.0
  '@fontsource-variable/unbounded': ^5.3.0
  '@fontsource-variable/jetbrains-mono': ^5.3.0
