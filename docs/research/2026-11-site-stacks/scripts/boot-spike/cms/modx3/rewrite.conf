    # Rules of MODX's ht.access: the core stays closed, friendly addresses to index.php?q=.
    RewriteEngine On
    RewriteBase /
    RewriteRule "^\.well-known/" - [L]
    RewriteRule "^core/" - [F]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^(.*)$ index.php?q=$1 [L,QSA]
