<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Враждебный кадр: огромный</title>
<style>
  body { margin: 0; font-family: "Golos Text", sans-serif; }
  .tall { height: 200000px; background: repeating-linear-gradient(180deg, #e3f2fd 0, #e3f2fd 400px, #fff3e0 400px, #fff3e0 800px); }
  .wide { width: 3000px; height: 40px; background: #ef9a9a; }
</style></head>
<body>
<h1>Кадр высотой 200 000 px и шириной 3 000 px</h1>
<div class="wide">Полоса шириной 3 000 px</div>
<div class="tall"></div>
<script>
  // A long list built by a script: 3 000 rows.
  const list = document.createElement('ol')
  for (let i = 1; i <= 3000; i++) { const li = document.createElement('li'); li.textContent = 'Строка ' + i + ' — товар с длинным названием для проверки предела'; list.appendChild(li) }
  document.body.insertBefore(list, document.querySelector('.tall'))
</script>
</body>
</html>
