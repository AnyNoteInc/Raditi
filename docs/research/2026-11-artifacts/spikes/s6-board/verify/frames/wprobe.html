<!doctype html><html><head><meta charset="utf-8"><title>w</title><style>body{margin:0;font:16px/1.5 system-ui} p{margin:0 0 8px}</style></head><body>
<script>for (let i = 0; i < 200; i++) document.write('<p>Строка текста, которая переносится по-разному на узком и широком окне: ' + 'слово '.repeat(12) + '</p>')</script>
<script>
// what the frame sees at load: its own width and content height (as the bridge reports them)
const post = (t) => parent.postMessage({ wp: 1, t, iw: innerWidth, sh: document.documentElement.scrollHeight }, '*')
addEventListener('load', () => { post('load'); new ResizeObserver(() => post('ro')).observe(document.documentElement); requestAnimationFrame(() => post('raf')) })
</script></body></html>
