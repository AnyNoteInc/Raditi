<!doctype html><html><head><meta charset="utf-8"><title>procs</title>
<style>body{margin:0;display:flex;flex-wrap:wrap;gap:4px} iframe{width:300px;height:200px;border:1px solid #ccc}</style></head>
<body><script>
// N frames from a second origin: sandbox attribute (attr=1) and/or CSP sandbox (default; nocsp=1 drops it)
const q = new URLSearchParams(location.search), n = Number(q.get('n') ?? 6)
window.__loaded = 0
for (let i = 0; i < n; i++) {
  const f = document.createElement('iframe')
  if (q.get('attr') !== '0') f.setAttribute('sandbox', 'allow-scripts')
  f.src = `${q.get('fo')}/plain.html?i=${i}${q.get('nocsp') === '1' ? '&nocsp=1' : ''}`
  f.onload = () => window.__loaded++
  document.body.appendChild(f)
}
</script></body></html>
