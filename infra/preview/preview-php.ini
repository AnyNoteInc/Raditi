; Settings of a preview's PHP on every stack (docs/plan/62, Т21): what the WordPress image gave
; (error-logging.ini, opcache-recommended.ini; preview-apache.conf overrides revalidate_freq),
; and mail that leaves nothing. A stack adds its own through PHP_INI_SCAN_DIR.
error_reporting = E_ERROR | E_WARNING | E_PARSE | E_CORE_ERROR | E_CORE_WARNING | E_COMPILE_ERROR | E_COMPILE_WARNING | E_RECOVERABLE_ERROR
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
log_errors_max_len = 1024
ignore_repeated_errors = On
ignore_repeated_source = Off
html_errors = Off
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=4000
opcache.revalidate_freq=2
sendmail_path = /usr/local/lib/raditi/no-sendmail
