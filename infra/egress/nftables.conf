#!/usr/sbin/nft -f
# /etc/nftables.conf on egress-1 (README.md, «Файрвол»). Replace every <PLACEHOLDER> first: until
# then `nft -c` refuses the file, so the sample can never load with an address nobody chose.
# Inbound: 443 only from the proxy's clients, SSH only from the admin. Outbound: DNS to the
# provider's resolvers, DHCP, NTP, and HTTP(S) to public addresses only: the proxy refuses
# private targets itself, this is the second line. Everything else is dropped. IPv6 carries only
# neighbour discovery: the proxy dials IPv4 so that providers always see one address.
flush ruleset

# The app VM's external address and, during the owner's manual channel check only, the owner's
# (README, section 5; remove it after the check).
define PROXY_CLIENTS = { <APP_VM_IPV4>, <OWNER_IPV4> }
# Where SSH comes from.
define ADMIN = <ADMIN_IPV4>
# The provider's resolvers: `resolvectl dns` shows them.
define RESOLVERS = { <RESOLVER_IPV4> }
# The same ranges as BLOCKED_IPV4 in llm-egress.mjs (a test keeps them equal).
define NON_PUBLIC = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4 }

table inet raditi_egress {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state invalid drop
    ct state established,related accept
    iif lo accept
    ip saddr $ADMIN tcp dport 22 accept
    ip saddr $PROXY_CLIENTS tcp dport 443 accept
    udp sport 67 udp dport 68 accept
    icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } ip6 hoplimit 255 accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy drop;
    ct state established,related accept
    oif lo accept
    ip daddr $RESOLVERS meta l4proto { tcp, udp } th dport 53 accept
    udp sport 68 udp dport 67 accept
    udp dport 123 accept
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit } accept
    ip daddr $NON_PUBLIC drop
    meta nfproto ipv4 tcp dport { 80, 443 } accept
  }
}
