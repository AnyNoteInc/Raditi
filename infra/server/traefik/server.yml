# Routes of the single server (infra/server/README.md), mounted next to raditi.yml by
# docker-compose.server.yml. Every host here is a separate HTTP-01 order, apex names only: no
# wildcard yet (owner, 08.11.2026).
#   - DASHBOARD_HOST: the Traefik dashboard (owner's request of 08.11.2026), basic auth from
#     /run/raditi/dashboard-users (bcrypt; kv/platform/app/traefik in Vault);
#   - the stream of the cloud browser on the cabinet's host goes to the stream gateway (preview);
#   - PAGES_ROOT_HOST: the root of the domain of pages (PAGES_BASE_DOMAIN; docs/plan/67, Д3; owner's
#     answer of 13.11.2026: pages.raditi.ru) is web, only for reading /v/<token> and robots.txt —
#     the paths its proxy answers there (PAGES_PATHS of apps/web/src/lib/pages-origin.ts); any
#     other request is Traefik's 404 and never reaches web: the routes that take a file skip the
#     proxy and would answer a method they lack 405 (web answers them 404 on this host itself).
#     Its subdomains are plan 69's (traefik/dynamic/pages.yml).
http:
  routers:
    dashboard:
      entryPoints: [websecure]
      rule: 'Host(`{{ env "DASHBOARD_HOST" }}`)'
      middlewares: [dashboard-auth]
      service: api@internal
      tls:
        certResolver: le
        domains: [{ main: '{{ env "DASHBOARD_HOST" }}' }]
    # {{ if env "PAGES_ROOT_HOST" }}
    pages-root:
      entryPoints: [websecure]
      rule: 'Host(`{{ env "PAGES_ROOT_HOST" }}`) && (Method(`GET`) || Method(`HEAD`)) && (Path(`/robots.txt`) || PathRegexp(`^/v/[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$`))'
      service: web
      tls:
        certResolver: le
        domains: [{ main: '{{ env "PAGES_ROOT_HOST" }}' }]
    # {{ end }}
    browser-stream:
      entryPoints: [websecure]
      rule: 'Host(`{{ env "BROWSER_STREAM_HOST" }}`) && Path(`/v1/browser/stream`)'
      priority: 1100
      service: browser-stream
      tls: {}
  middlewares:
    dashboard-auth:
      basicAuth:
        usersFile: /run/raditi/dashboard-users
        realm: Raditi
        removeHeader: true
  services:
    browser-stream:
      loadBalancer:
        servers: [{ url: 'http://preview:8091' }]
