# The single server (infra/server/README.md): everything of the platform on one VM, layered over
# infra/app/docker-compose.yml with COMPOSE_FILE=docker-compose.yml:server/docker-compose.server.yml.
# What the multi-VM design (spec §19) puts on other machines lives here:
#   - Vault (OpenBao) and the secret renderer — on the host, systemd (host/);
#   - S3 — SeaweedFS, TLS from the internal CA as s3.raditi.internal;
#   - the sandbox VM — runner and watchdog under gVisor (runsc), on this Docker;
#   - mcp, browser and the stream gateway of the cloud browser (preview).
# The private address 10.10.0.10 (raditi-net.service) stands for the private network: Vault, S3,
# PostgreSQL for the host-network processes, the runner API, llm, mcp and browser listen or are
# published only there, and raditi-host.nft drops it from outside. llm goes to Z.ai directly
# (owner's answer to П2): no egress node, no LLM_EGRESS_*.
name: raditi-app

x-logging: &logging
  driver: journald
  options: { tag: '{{.Name}}' }

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging

x-internal-hosts: &internal-hosts
  - vault.raditi.internal:10.10.0.10
  - s3.raditi.internal:10.10.0.10
  - git.raditi.internal:10.10.0.10

# Our Gitea (git of turns, site repositories, /release): https only, the internal CA
x-gitea: &gitea-url
  GITEA_URL: https://git.raditi.internal:3443

# Previews of chats on this machine (SINGLE_SERVER=on, owner's answer of 08.11.2026): one address
# for web, core, mcp and the gateway; the wildcard of PREVIEW_BASE_DOMAIN comes by DNS-01 (reg.ru)
x-preview-address: &preview-address
  PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:?Set PREVIEW_BASE_DOMAIN}
  PREVIEW_SCHEME: https

# Published pages on this machine (docs/plan/69-pages.md, Ст3): one domain for web, mcp and the
# pages listener of preview — core names no page address; the wildcard of PAGES_BASE_DOMAIN comes by DNS-01 (reg.ru)
x-pages-address: &pages-address
  PAGES_BASE_DOMAIN: ${PAGES_BASE_DOMAIN:?Set PAGES_BASE_DOMAIN}

x-s3: &s3
  S3_ENDPOINT: https://s3.raditi.internal:8333
  S3_REGION: ru-msk
  S3_FORCE_PATH_STYLE: 'true'

x-secrets: &secrets
  type: bind
  target: /run/raditi
  read_only: true
  bind: { create_host_path: false }

services:
  traefik:
    environment:
      # traefik/dynamic/server.yml (deploy.sh copies it there from server/traefik): the dashboard
      # with basic auth and the apex of previews. Not a bind mount of its own: Docker cannot make
      # its mount point inside the read-only bind of traefik/dynamic.
      DASHBOARD_HOST: ${DASHBOARD_HOST:?Set DASHBOARD_HOST}
      PREVIEW_APEX_HOST: ${PREVIEW_APEX_HOST:-}
      BROWSER_STREAM_HOST: ${APP_DOMAIN}
      # The wildcard of previews (traefik/dynamic/preview.yml): DNS-01 through the reg.ru API
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:?Set PREVIEW_BASE_DOMAIN}
      # The wildcard of published pages (traefik/dynamic/pages.yml): the same reg.ru account
      PAGES_BASE_DOMAIN: ${PAGES_BASE_DOMAIN:?Set PAGES_BASE_DOMAIN}
      REGRU_USERNAME_FILE: /run/raditi/regru-username
      REGRU_PASSWORD_FILE: /run/raditi/regru-password
      # reg.ru serves a new TXT record from its name servers after minutes, not seconds
      REGRU_PROPAGATION_TIMEOUT: '1800'
      REGRU_POLLING_INTERVAL: '30'
      REGRU_TTL: '300'
    volumes:
      - { <<: *secrets, source: '${SECRETS_DIR:-/run/raditi}/traefik' }
    networks: [stream-edge]

  web:
    environment:
      <<: [*s3, *gitea-url, *preview-address, *pages-address]
      # The panel of the cloud browser: Traefik routes this path of the apex to the stream gateway
      BROWSER_STREAM_PUBLIC_URL: wss://${APP_DOMAIN}/v1/browser/stream
    extra_hosts: *internal-hosts

  core:
    # Previews in this machine's Docker under runsc (PREVIEW_EXECUTOR=local): the socket's group
    group_add: ['${DOCKER_GID:?Set DOCKER_GID, the group of /var/run/docker.sock}']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      <<: [*s3, *gitea-url, *preview-address]
      SINGLE_SERVER: 'on'
      # Eight turns of a workspace at once, and no other limit of turns (owner's request of
      # 13.11.2026, docs/plan/70-turn-without-time-limit.md, ВР13, ВР26)
      WORKSPACE_TURN_LIMIT: '8'
      PREVIEW_EXECUTOR: local
      PREVIEW_RUNTIME: runsc
      SANDBOX_DOCKER_SOCKET: /var/run/docker.sock
      SANDBOX_NETWORK_GUARD_IMAGE: ${SANDBOX_NETWORK_GUARD_IMAGE:?Set the digest-pinned network guard image}
      PREVIEW_SITE_IMAGES: ${PREVIEW_SITE_IMAGES:?Set PREVIEW_SITE_IMAGES}
      PREVIEW_FORWARDER_IMAGE: ${PREVIEW_FORWARDER_IMAGE:?Set the digest-pinned preview forwarder image}
      PREVIEW_BROWSER_IMAGE: ${PREVIEW_BROWSER_IMAGE:?Set the digest-pinned preview browser image}
      PREVIEW_DB_IMAGE: ${PREVIEW_DB_IMAGE:?Set the digest-pinned preview database image}
      # A preview publishes its entry on the private address; the gateway and mcp reach it there
      PREVIEW_UPSTREAM_HOST: 10.10.0.10
      PREVIEW_GATEWAY_PORT: '8090'
      PREVIEW_RELAY_GATEWAY_HOST: 10.10.0.10
      GIT_CA_FILE: /run/raditi/vault-ca.pem
      GIT_MIRROR_DIR: /work/mirrors
      # The release API for the deploy jobs: they run in the host network and reach core's fixed
      # address on core-egress directly (spec §10, «Выпуск»)
      RELEASE_API_HOST: 172.29.83.10
      RELEASE_API_PORT: '8085'
      RELEASE_API_PUBLIC_URL: http://172.29.83.10:8085
      LLM_CONTROL_URL: http://10.10.0.10:${LLM_GATEWAY_PUBLISH:-8084}
      BROWSER_WORKER_URL: http://10.10.0.10:8086
      SANDBOX_EGRESS_REFUSED_SUBNETS: ${SANDBOX_EGRESS_REFUSED_SUBNETS:?Set SANDBOX_EGRESS_REFUSED_SUBNETS}
    extra_hosts: *internal-hosts
    networks:
      core-data: {}
      core-egress: { ipv4_address: 172.29.83.10 }

  postgres:
    # The host-network processes (browser) reach the database on the private address only
    ports: ['10.10.0.10:5432:5432']
    # A port is published only through a network with a gateway; the others are internal
    networks: [preview-data, server-pub]

  llm:
    environment:
      # The direct path to api.z.ai: the four egress variables empty (all or none, llm-config.ts)
      LLM_EGRESS_PROXY_URL: ''
      LLM_EGRESS_CA_FILE: ''
      LLM_EGRESS_CLIENT_CERT_FILE: ''
      LLM_EGRESS_CLIENT_KEY_FILE: ''
      LLM_GATEWAY_HOSTS: 127.0.0.1:8084,10.10.0.10:${LLM_GATEWAY_PUBLISH:-8084}
    # The base file leaves llm without a resolver (its only way out was the egress proxy by IP)
    dns: !override [77.88.8.8, 77.88.8.1]
    # Its published port goes to its address on core-egress (the gateway network): a sandbox then
    # reaches it from 172.29.83.1, the very address core sees the runner from and binds the turn
    # key to (llm_keys.bound_source). On llm-out it came from 172.29.84.1, and every key failed.
    networks:
      core-egress: { gw_priority: 2 }
    extra_hosts: *internal-hosts

  s3:
    <<: *hardened
    image: ${SEAWEEDFS_IMAGE:?Set the digest-pinned SeaweedFS image}
    # weed is no init: without one every health check left a zombie, and 512 of them stopped
    # the container from starting a process (v1.27.0)
    init: true
    user: '10007:10007'
    depends_on:
      server-volume-init: { condition: service_completed_successfully }
    command:
      - server
      - -dir=/data
      - -ip=s3
      - -ip.bind=0.0.0.0
      # Otherwise it reports cluster statistics abroad (telemetry.seaweedfs.com, rule 1)
      - -master.telemetry=false
      - -s3
      - -s3.port=8333
      - -s3.config=/run/raditi/s3.json
      - -s3.cert.file=/run/raditi/s3.pem
      - -s3.key.file=/run/raditi/s3.key
      - -volume.max=0
    ports: ['10.10.0.10:8333:8333']
    volumes:
      # nocopy: an empty volume would otherwise get /data of the image, owned by uid 1000
      - { type: volume, source: s3-data, target: /data, volume: { nocopy: true } }
      - { <<: *secrets, source: '${SECRETS_DIR:-/run/raditi}/s3' }
    tmpfs: ['/tmp:size=64m,uid=10007,gid=10007,mode=0700']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null --no-check-certificate https://127.0.0.1:8333/healthz || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: 1
    mem_limit: 1g
    pids_limit: 512
    networks:
      s3-net: { aliases: [s3.raditi.internal] }
      server-pub: {}

  # The six buckets of spec §14, created once and again on every deploy (no-op when they exist)
  s3-buckets:
    image: ${SEAWEEDFS_IMAGE:?Set the digest-pinned SeaweedFS image}
    profiles: [ops]
    restart: 'no'
    user: '10007:10007'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    depends_on:
      s3: { condition: service_healthy }
    entrypoint: ['/bin/sh', '-euc']
    command:
      - |
        for bucket in raditi-inbox raditi-sessions raditi-logs raditi-artifacts raditi-backups raditi-platform; do
          printf 's3.bucket.create -name %s\nexit\n' "$$bucket" | weed shell -master=s3:9333 >/dev/null 2>&1 || true
        done
        # weed shell waits for more input without `exit`
        printf 's3.bucket.list\nexit\n' | weed shell -master=s3:9333 2>&1 | grep -c '^  raditi-'
    networks: [s3-net]

  server-volume-init:
    image: ${REDIS_IMAGE:?Set the digest-pinned Redis image}
    restart: 'no'
    user: '0:0'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    logging: *logging
    entrypoint: ['/bin/sh', '-euc']
    command: ['chown 10007:10007 /v/s3 && chmod 0700 /v/s3']
    volumes:
      - s3-data:/v/s3

  # Host network: the agent's browser on a preview drives Chromium on the host's loopback
  # (MCP_BROWSER_PROFILE=local); its port 8082 is closed from outside by raditi-host.nft.
  mcp:
    <<: *hardened
    image: ${MCP_IMAGE:?Set the digest-pinned mcp image}
    init: true
    user: '10005:10005'
    network_mode: host
    command: ['--env-file=/run/raditi/app.env', 'dist/main.js']
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }
    environment:
      <<: [*s3, *preview-address, *pages-address]
      NODE_ENV: production
      APP_ENV: production
      VAULT_ADDR: https://vault.raditi.internal:8200
      NODE_EXTRA_CA_CERTS: /run/raditi/vault-ca.pem
      MCP_PORT: '8082'
      # The host of the Host sandbox-gw sends upstream (SANDBOX_MCP_UPSTREAM of the runner), no port
      MCP_ALLOWED_HOSTS: 10.10.0.10
      BROWSER_WORKER_URL: http://10.10.0.10:8086
      SINGLE_SERVER: 'on'
      MCP_CONTENT_PROFILE: local
      MCP_BROWSER_PROFILE: local
      S3_BUCKET_ARTIFACTS: raditi-artifacts
      PREVIEW_UPSTREAM_HOST: 10.10.0.10
      HOME: /tmp
    volumes:
      - { <<: *secrets, source: '${SECRETS_DIR:-/run/raditi}/mcp' }
    tmpfs: ['/tmp:size=64m,uid=10005,gid=10005,mode=0700']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8082/health').then(r => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 40s
    cpus: 1
    mem_limit: 1g
    pids_limit: 512

  # The cloud browser of chats (apps/browser): Chromium of each session in its own container under
  # runsc. Host network: the control ports of Chromium are published on the host's loopback, and
  # it listens on the private address only.
  browser:
    <<: *hardened
    image: ${BROWSER_WORKER_IMAGE:?Set the digest-pinned browser image}
    init: true
    user: '10006:10006'
    group_add: ['${DOCKER_GID:?Set DOCKER_GID, the group of /var/run/docker.sock}']
    network_mode: host
    command: ['--env-file=/run/raditi/app.env', 'dist/main.js']
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }
    environment:
      <<: *s3
      NODE_ENV: production
      APP_ENV: production
      NODE_EXTRA_CA_CERTS: /run/raditi/vault-ca.pem
      S3_BUCKET_INBOX: raditi-inbox
      BROWSER_WORKER_HOST: 10.10.0.10
      BROWSER_WORKER_PORT: '8086'
      BROWSER_RUNTIME: runsc
      BROWSER_DOCKER_SOCKET: /var/run/docker.sock
      BROWSER_IMAGE: ${BROWSER_IMAGE:?Set the digest-pinned browser session image}
      BROWSER_FORWARDER_IMAGE: ${BROWSER_FORWARDER_IMAGE:?Set the digest-pinned forwarder image}
      BROWSER_EGRESS_IMAGE: ${BROWSER_EGRESS_IMAGE:?Set the digest-pinned client egress image}
      SANDBOX_NETWORK_GUARD_IMAGE: ${SANDBOX_NETWORK_GUARD_IMAGE:?Set the digest-pinned network guard image}
      SANDBOX_EGRESS_REFUSED_SUBNETS: ${SANDBOX_EGRESS_REFUSED_SUBNETS:?Set SANDBOX_EGRESS_REFUSED_SUBNETS}
      BROWSER_PLATFORM_HOSTS: ${BROWSER_PLATFORM_HOSTS:?Set BROWSER_PLATFORM_HOSTS}
      HOME: /tmp
    extra_hosts: *internal-hosts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - { <<: *secrets, source: '${SECRETS_DIR:-/run/raditi}/browser' }
    tmpfs: ['/tmp:size=256m,uid=10006,gid=10006,mode=0700']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://10.10.0.10:8086/health').then(() => process.exit(0), () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 40s
    cpus: 2
    mem_limit: 2g
    pids_limit: 1024

  # The gateway of previews (8090, the wildcard route of traefik/dynamic/preview.yml) and the stream
  # gateway of the cloud browser (8091). 8090 is published on the private address for the relay
  # of the agent's browser, which comes from the gateway of preview-out (PREVIEW_BROWSER_RELAYS).
  preview:
    <<: *hardened
    image: ${PREVIEW_GATEWAY_IMAGE:?Set the digest-pinned preview gateway image}
    init: true
    user: '10009:10009'
    command: ['--env-file=/run/raditi/app.env', 'dist/main.js']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      APP_ENV: production
      <<: [*preview-address, *gitea-url, *pages-address]
      APP_URL: https://${APP_DOMAIN}
      PREVIEW_GATEWAY_PORT: '8090'
      # The pages listener (traefik/dynamic/pages.yml); PAGES_COOKIE_SECRET is in app.env
      PAGES_PORT: '8092'
      PREVIEW_BROWSER_RELAYS: 172.29.90.1/32
      BROWSER_WORKER_URL: http://10.10.0.10:8086
      BROWSER_STREAM_PORT: '8091'
      HOME: /tmp
    volumes:
      - { <<: *secrets, source: '${SECRETS_DIR:-/run/raditi}/preview' }
    tmpfs: ['/tmp:size=16m,uid=10009,gid=10009,mode=0700']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8090/__raditi/health').then(r => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 40s
    cpus: 1
    mem_limit: 512m
    pids_limit: 256
    ports: ['10.10.0.10:8090:8090']
    networks: [stream-edge, preview-data, preview-out]

  # Gitea of the platform (spec §10): site repositories, git of turns, platform/ci and Actions.
  # Repository workflows are off (WORKFLOW_DIRS names a path no repository has): only the scoped
  # workflows of platform/ci run, deploy.yml on a release tag. gitea-setup.mjs makes the
  # accounts, the organisations and platform/ci (README.md, «Gitea»).
  gitea:
    image: ${GITEA_IMAGE:?Set the digest-pinned Gitea image}
    restart: unless-stopped
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    environment:
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__PROTOCOL: https
      GITEA__server__HTTP_PORT: '3000'
      GITEA__server__DOMAIN: git.raditi.internal
      GITEA__server__ROOT_URL: https://git.raditi.internal:3443/
      GITEA__server__CERT_FILE: /run/raditi/git.pem
      GITEA__server__KEY_FILE: /run/raditi/git.key
      GITEA__server__DISABLE_SSH: 'true'
      GITEA__server__START_SSH_SERVER: 'false'
      GITEA__service__DISABLE_REGISTRATION: 'true'
      GITEA__actions__ENABLED: 'true'
      GITEA__actions__DEFAULT_ACTIONS_URL: self
      GITEA__actions__WORKFLOW_DIRS: .git/raditi-no-repository-workflows
      GITEA__webhook__ALLOWED_HOST_LIST: private,loopback
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA__log__LEVEL: Warn
    ports: ['10.10.0.10:3443:3000']
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
      - { <<: *secrets, source: '${SECRETS_DIR:-/run/raditi}/gitea' }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null --no-check-certificate https://127.0.0.1:3000/api/healthz || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cpus: 1
    mem_limit: 1g
    pids_limit: 512
    networks: [server-pub]

  # The deploy runner of `sites` (ci/README.md): label `deploy` on the core image of this release,
  # written by deploy.sh into server/runner/runner.yaml. Host network: its jobs reach Vault, S3 and
  # Gitea on 10.10.0.10 and the release API on 172.29.83.10; they get no Docker socket.
  gitea-runner:
    image: ${GITEA_RUNNER_IMAGE:?Set the digest-pinned gitea/runner image}
    restart: unless-stopped
    network_mode: host
    depends_on:
      gitea: { condition: service_healthy }
    environment:
      GITEA_INSTANCE_URL: https://git.raditi.internal:3443
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /run/raditi/registration-token
      GITEA_RUNNER_NAME: server-deploy
      GITEA_RUNNER_LABELS: deploy:docker://${CORE_IMAGE}
      CONFIG_FILE: /config/runner.yaml
      SSL_CERT_FILE: /run/raditi/ca.pem
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitea-runner-data:/data
      - ./server/runner:/config:ro
      - { <<: *secrets, source: '${SECRETS_DIR:-/run/raditi}/gitea-runner' }
    logging: *logging

  # The sandbox VM's two processes (infra/sandbox/docker-compose.yml), here on the same Docker.
  watchdog:
    image: ${SANDBOX_WATCHDOG_IMAGE:?Set the digest-pinned watchdog image}
    restart: unless-stopped
    user: '0:0'
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 32
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *logging

  # Host network. Without the userland proxy Docker masquerades a local connection to a published
  # port as the gateway of the target's bridge: core sees the runner from 172.29.83.1, the gateway
  # of core-egress pinned below, and its token hash is bound to that address.
  # Only /etc/raditi/runner (the token) and the public CA are mounted, never /etc/raditi itself.
  runner:
    image: ${RUNNER_IMAGE:?Set the digest-pinned runner image}
    restart: unless-stopped
    user: '0:0'
    read_only: true
    init: true
    network_mode: host
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      core: { condition: service_healthy }
    cpus: 1
    mem_limit: 512m
    pids_limit: 256
    tmpfs: ['/tmp:size=64m']
    environment:
      NODE_ENV: production
      APP_ENV: production
      RUNNER_CORE_URL: http://10.10.0.10:${RUNNER_API_PUBLISH:-8083}
      RUNNER_TOKEN_FILE: /etc/raditi/runner-token
      RUNNER_S3_ORIGIN: https://s3.raditi.internal:8333/raditi-sessions
      RUNNER_S3_CA_FILE: /etc/raditi/ca.pem
      # As many turns at once as the protocol carries: the only limit of turns is the eight of a
      # workspace (owner's request of 13.11.2026, docs/plan/70-turn-without-time-limit.md, ВР26)
      RUNNER_MAX_TURNS: '1024'
      SANDBOX_RUNTIME: runsc
      SANDBOX_DOCKER_SOCKET: /var/run/docker.sock
      SANDBOX_GATEWAY_IMAGE: ${SANDBOX_GATEWAY_IMAGE:?Set the digest-pinned sandbox gateway image}
      SANDBOX_NETWORK_GUARD_IMAGE: ${SANDBOX_NETWORK_GUARD_IMAGE:?Set the digest-pinned network guard image}
      SANDBOX_LLM_UPSTREAM: http://10.10.0.10:${LLM_GATEWAY_PUBLISH:-8084}
      SANDBOX_MCP_UPSTREAM: http://10.10.0.10:8082
      SANDBOX_EGRESS_REFUSED_SUBNETS: ${SANDBOX_EGRESS_REFUSED_SUBNETS:?Set SANDBOX_EGRESS_REFUSED_SUBNETS}
    extra_hosts: *internal-hosts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/raditi/runner:/etc/raditi:ro
    logging: *logging

networks:
  # Pinned: the runner's token hash is bound to its gateway (RUNNER_TOKENS=…@172.29.83.1)
  core-egress:
    ipam:
      config:
        - subnet: 172.29.83.0/24
          gateway: 172.29.83.1
  s3-net: { internal: true }
  # The gateway of the ports published on the private address (S3, PostgreSQL)
  server-pub:
    driver_opts: { com.docker.network.bridge.name: '${BRIDGE_PREFIX:-rd}-pub' }
  stream-edge: { internal: true } # Traefik ↔ the stream gateway
  preview-data: { internal: true }
  # Pinned: a connection to 10.10.0.10:8090 arrives as its gateway (PREVIEW_BROWSER_RELAYS)
  preview-out:
    driver_opts: { com.docker.network.bridge.name: '${BRIDGE_PREFIX:-rd}-preview' }
    ipam:
      config:
        - subnet: 172.29.90.0/24
          gateway: 172.29.90.1

volumes:
  s3-data: { external: true, name: '${VOLUME_PREFIX:-raditi-app}-s3' }
  gitea-data: { external: true, name: '${VOLUME_PREFIX:-raditi-app}-gitea' }
  # app.ini with the keys Gitea generates once (SECRET_KEY encrypts the secrets of Actions)
  gitea-config: { external: true, name: '${VOLUME_PREFIX:-raditi-app}-gitea-config' }
  gitea-runner-data: { external: true, name: '${VOLUME_PREFIX:-raditi-app}-gitea-runner' }
