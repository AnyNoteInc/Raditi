# /etc/systemd/system/docker.service.d/llm.conf
[Unit]
Requires=raditi-llm-firewall.service
After=raditi-llm-firewall.service

[Service]
# RemainAfterExit alone is insufficient after an external ruleset reload. Check the real
# boundary on every daemon start, before Docker can auto-start its existing containers.
ExecStartPre=/usr/bin/node /usr/local/lib/raditi/llm-firewall.mjs check --env-file /opt/raditi/app/.env
