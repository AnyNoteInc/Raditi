# vsftpd of the stand's hosting. entrypoint.sh appends the passive ports the stand published.
listen=YES
listen_ipv6=NO
listen_port=21
background=NO
ftpd_banner=Stand hosting FTP
anonymous_enable=NO
local_enable=YES
# FTP for `site` and `ftpsite` only: the SSH accounts of the other scenarios stay off it.
userlist_enable=YES
userlist_deny=NO
userlist_file=/opt/stand/ftp-users
# Writable, so a check can prove the product wrote nothing (the tree is compared, not guarded).
write_enable=YES
local_umask=022
chroot_local_user=YES
# Passive data only, always on the published loopback address: no active mode at all.
port_enable=NO
pasv_enable=YES
pasv_address=127.0.0.1
pasv_addr_resolve=NO
# Explicit FTPS (AUTH TLS) with the stand's certificate; plain FTP stays allowed for an explicit
# choice. Data connections must reuse the TLS session of the control connection (the default).
ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=NO
force_local_data_ssl=NO
require_ssl_reuse=YES
ssl_ciphers=HIGH
rsa_cert_file=/stand/run/ftp-cert.pem
rsa_private_key_file=/stand/run/ftp-key.pem
# No namespaces or seccomp in a container without the capabilities for them.
seccomp_sandbox=NO
isolate=NO
isolate_network=NO
xferlog_enable=YES
vsftpd_log_file=/proc/1/fd/1
dual_log_enable=NO
