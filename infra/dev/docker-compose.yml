# Радити — локальная инфраструктура для разработки. Не для прода.
# Запуск из корня репозитория:
#   docker compose --env-file .env -f infra/dev/docker-compose.yml up -d
# Профили: site — тестовый WordPress, llm — LiteLLM, ci — act_runner.

name: raditi-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: raditi
      POSTGRES_PASSWORD: raditi
      POSTGRES_DB: raditi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raditi -d raditi"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 для разработки — SeaweedFS вместо MinIO (spec §14). В проде — S3 российского облака.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # Создаёт бакеты raditi-* и завершается.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-raditi}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-raditi-dev-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-ru-central1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://s3:8333 s3 ls >/dev/null 2>&1 && break
          sleep 2
        done
        for b in raditi-inbox raditi-sessions raditi-logs raditi-artifacts raditi-backups raditi-platform; do
          aws --endpoint-url http://s3:8333 s3 mb "s3://$$b" || true
        done
    restart: "no"

  # OpenBao в dev-режиме: данные в памяти, root-токен из .env.
  vault:
    image: ghcr.io/openbao/openbao:latest
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-raditi-dev-root}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"

  gitea:
    image: gitea/gitea:1.27-rootless
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:3300/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__actions__DEFAULT_ACTIONS_URL: self
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
    ports:
      - "3300:3000"
      - "2222:2222"
    volumes:
      - giteadata:/var/lib/gitea
      - giteaconf:/etc/gitea

  # act_runner: токен регистрации — в Gitea, «Администрирование → Actions → Раннеры».
  runner:
    image: gitea/act_runner:latest
    profiles: ["ci"]
    depends_on:
      - gitea
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: raditi-dev-runner
      GITEA_RUNNER_LABELS: check:docker://node:22-bookworm,deploy:docker://node:22-bookworm
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runnerdata:/data

  # LiteLLM — единая точка к моделям. ID моделей — в litellm.config.yaml.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: ["llm"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-raditi-dev}
      DATABASE_URL: postgresql://raditi:raditi@postgres:5432/litellm
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY:-}
    ports:
      - "4000:4000"
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro

  # Тестовый сайт клиента: WordPress + MariaDB + WP-CLI.
  site-db:
    image: mariadb:11.4
    profiles: ["site"]
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: wp-root
    volumes:
      - sitedb:/var/lib/mysql

  site:
    image: wordpress:php8.3-apache
    profiles: ["site"]
    depends_on:
      - site-db
    environment:
      WORDPRESS_DB_HOST: site-db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    ports:
      - "8080:80"
    volumes:
      - sitefiles:/var/www/html

  # Разовый запуск: docker compose -f infra/dev/docker-compose.yml --profile site run --rm wpcli core version
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["site"]
    user: "33:33"
    depends_on:
      - site
    environment:
      WORDPRESS_DB_HOST: site-db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    entrypoint: ["wp"]
    command: ["--info"]
    volumes:
      - sitefiles:/var/www/html

volumes:
  pgdata:
  s3data:
  giteadata:
  giteaconf:
  runnerdata:
  sitedb:
  sitefiles:
