# Стартовые алерты по spec §19. Без Alertmanager они видны только в интерфейсе Prometheus;
# Alertmanager с доставкой на почту — в проде (M9).
groups:
  - name: raditi
    rules:
      - alert: TaskQueuedTooLong
        expr: max(raditi_task_oldest_queued_age_seconds) > 600
        for: 1m
        annotations: { summary: 'Задача ждёт в очереди дольше 10 минут' }
      - alert: DeployFailed
        expr: sum(increase(raditi_deploys_total{result="failed"}[15m])) > 0
        annotations: { summary: 'Ошибка выкладки' }
      - alert: DeployRolledBack
        expr: sum(increase(raditi_deploys_total{result="rolled_back"}[15m])) > 0
        annotations: { summary: 'Выкладка откатилась' }
      - alert: ServiceDown
        expr: up{job=~"postgres|redis|seaweedfs|openbao|gitea"} == 0
        for: 2m
        annotations: { summary: 'Сервис инфраструктуры недоступен' }
      - alert: EndpointDown
        # Дополнительные compose-профили проверяются отдельно (monitoring/README.md).
        expr: probe_success{compose_profile=""} == 0
        for: 2m
        annotations: { summary: 'Проверка доступности не проходит' }
      # Расход, который шлюз подписок не смог записать: деньги и квоты. Алерты пула — M9.
      - alert: LlmUsageNotPersisted
        expr: sum(increase(raditi_llm_persistence_failed_total[15m])) > 0
        annotations: { summary: 'Шлюз подписок не записал расход' }
      # Окна пула ИИ-агента и лимиты пространств (docs/plan/70-usage-limits.md, §4.4).
      - alert: LlmPoolFiveHoursLow
        expr: min(raditi_llm_pool_window_remaining_ratio{window="5h"}) < 0.2
        for: 10m
        annotations: { summary: 'В окне 5 часов пула свободно меньше 20 %' }
      - alert: LlmAccountWeekHigh
        # Неделя аккаунта занята больше чем на 85 %, а до сброса больше 48 часов: пул
        # израсходует неделю раньше сброса. Срок сброса шлюз не отдаёт метрикой — его видно в
        # `pnpm --filter core llm:usage`; правило срабатывает по занятости.
        expr: >-
          max by (account) (raditi_llm_account_window_used_credits{window="week"}
            / raditi_llm_account_window_limit_credits{window="week"}) > 0.85
        for: 10m
        annotations: { summary: 'Неделя аккаунта пула занята больше чем на 85 %' }
      - alert: PassLimitsOut
        expr: sum(increase(raditi_pass_limits_out_total[15m])) > 0
        annotations: { summary: 'Лимиты ИИ-агента закончились: проход кончился ошибкой (план 68)' }
