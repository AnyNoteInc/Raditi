# Конфиг раннера Gitea Actions (gitea/runner 4.0). Остальные поля — по умолчанию.
# Метрики без авторизации: порт 9101 наружу не публикуется.
metrics:
  enabled: true
  addr: ':9101'

# Контейнеры заданий собирают код клиентов: без сокета Docker, без привилегий и без томов хоста.
container:
  # '-': раннер сам находит Docker, но не монтирует его сокет в задания и actions.
  docker_host: '-'
  privileged: false
  # Пустой список — заданиям нельзя монтировать тома и каталоги хоста.
  valid_volumes: []
