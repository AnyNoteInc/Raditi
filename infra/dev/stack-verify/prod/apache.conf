# The «production hosting» of a stand of the site stacks (docs/plan/62-slices/e3.md, Э3.8): Apache as
# root dropping to www-data, `.htaccess` honoured, as a shared hosting runs a site.
ServerRoot "/etc/apache2"
PidFile /tmp/apache2-prod.pid
Mutex file:/tmp default
User www-data
Group www-data
ServerName prod.stand.invalid
ErrorLog /proc/self/fd/2
LogLevel warn
IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf
Listen 0.0.0.0:80
DocumentRoot /var/www/html
<Directory />
  AllowOverride None
  Require all denied
</Directory>
<Directory /var/www/html>
  Options FollowSymLinks
  AllowOverride All
  Require all granted
  DirectoryIndex index.php index.html
</Directory>
<FilesMatch "\.php$">
  SetHandler application/x-httpd-php
</FilesMatch>
