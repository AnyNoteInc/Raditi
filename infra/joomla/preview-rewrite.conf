    # The rules of Joomla's htaccess.txt: no .htaccess is read in a preview.
    RewriteEngine On
    RewriteBase /
    RewriteRule ^(?:administrator/(?:logs|cache)|cache|tmp)(?:/|$) - [F]
    RewriteRule ^(?:configuration|defines)\.php$ - [F]
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    # The API of Joomla 4 and later; a tree without it goes on to index.php.
    RewriteCond %{REQUEST_URI} ^/api/
    RewriteCond %{REQUEST_URI} !^/api/index\.php
    RewriteCond %{DOCUMENT_ROOT}/api/index.php -f
    RewriteRule .* api/index.php [L]
    RewriteCond %{REQUEST_URI} !^/index\.php
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule .* index.php [L]
