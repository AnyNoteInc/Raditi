# Apache of a Raditi preview (docs/plan/53-chat-preview-release.md, Р18): the whole server
# configuration, in place of the image's apache2.conf. The server runs as the unprivileged user
# it is started as, on 8080, with a read-only root file system: its run and lock folders are on
# the tmpfs /tmp. No .htaccess is read — the import leaves them out, and a site's PHP could write
# one — so the rewrite rules of WordPress are here.

ServerRoot "/etc/apache2"
DefaultRuntimeDir /tmp/apache2/run
PidFile /tmp/apache2/run/apache2.pid
Mutex file:/tmp/apache2/lock default
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
HostnameLookups Off
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
LimitRequestBody 33554432

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

# The modules the image enabled, PHP and mod_rewrite among them.
IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf
<IfModule !rewrite_module>
    LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
</IfModule>

# The code a sync, a reset or a rebuild writes is what the next request runs: the image's
# opcache-recommended.ini looks at a file's time only every 2 s, and a check of the agent's
# browser right after a sync would see the code it had before (stand R12). Speed does not
# matter in a preview.
<IfModule php_module>
    php_admin_flag opcache.validate_timestamps on
    php_admin_value opcache.revalidate_freq 0
</IfModule>
<IfModule php7_module>
    php_admin_flag opcache.validate_timestamps on
    php_admin_value opcache.revalidate_freq 0
</IfModule>

# A few workers: a preview has one visitor and a memory limit.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 4
    MaxRequestWorkers 16
    MaxConnectionsPerChild 500
</IfModule>

Listen 8080

<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot /var/www/html
<Directory /var/www/html>
    Options SymLinksIfOwnerMatch
    AllowOverride None
    Require all granted
    DirectoryIndex index.php index.html
    # The rules WordPress writes into .htaccess for pretty permalinks.
    RewriteEngine On
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteBase /
    RewriteRule ^index\.php$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.php [L]
</Directory>

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

# Hidden files and folders are never served, .well-known aside.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(?!well-known(?:/|$))">
    Require all denied
</DirectoryMatch>
